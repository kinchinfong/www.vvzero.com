<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <link rel="shortcut icon" href="favicon.ico">
    <title>恋爱计时器</title>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            font-family: Helvetica Neue, Helvetica, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
            background-color: #FFCC99;
            font-size: 85%;
            margin: 0;
        }
        
        h2 {
            font-size: 220%;
            font-weight: 400;
        }
        
        .content {
            position: absolute;
            width: 100%;
            top: 40%;
            transform: translate(0, -50%);
            text-align: center;
        }
        
        .timer {
            font-size: 180%;
            line-height: 1.5;
            margin: 1em 0;
        }
        
        .timer b {
            color: rgb(253, 99, 125);
        }

        .anniversary-link {
            display: inline-block;
            padding: 12px 22px;
            border: 1px solid #c4686a;
            border-radius: 24px;
            color: #a54850;
            background-color: rgba(255, 244, 224, 0.25);
            font-size: 14px;
            line-height: 1.5;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .anniversary-link:hover {
            background-color: rgba(255, 244, 224, 0.5);
        }

        .anniversary-link:focus-visible {
            outline: 2px solid #a54850;
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <div class="content">
        <h2>猪，我们已经在一起了</h2>
        <div class="timer">
            <b id="d"></b> 天 <b id="h"></b> 时 <b id="m"></b> 分 <b id="s"></b> 秒
        </div>
        <a class="anniversary-link" href="10th_anniversary.html">十周年纪念 · 我们的故事 <span aria-hidden="true">→</span></a>
    </div>

    <script>
        function timer() {
            var start = new Date(2016, 9, 21); // 2016.10.21
            var t = new Date() - start;
            var h = ~~(t / 1000 / 60 / 60 % 24);
            if (h < 10) {
                h = "0" + h;
            }
            var m = ~~(t / 1000 / 60 % 60);
            if (m < 10) {
                m = "0" + m;
            }

            var s = ~~(t / 1000 % 60);
            if (s < 10) {
                s = "0" + s;
            }
            document.getElementById('d').innerHTML = ~~(t / 1000 / 60 / 60 / 24);
            document.getElementById('h').innerHTML = h;
            document.getElementById('m').innerHTML = m;
            document.getElementById('s').innerHTML = s;
        }
        timer();
        setInterval(timer, 1000);
    </script>
</body>

</html>
